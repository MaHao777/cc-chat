[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-chat"
version = "0.1.0"
description = "AICHAT: a persistent companion on Claude Code and cc-connect"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.10", "jinja2>=3.1", "httpx>=0.28", "tomlkit>=0.13", "sentence-transformers>=3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[project.scripts]
cc-chat = "cc_chat.cli:main"
cc-chat-adapter = "cc_chat.adapter:main"

[tool.setuptools.packages.find]
include = ["cc_chat*"]

[tool.setuptools.package-data]
cc_chat = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
